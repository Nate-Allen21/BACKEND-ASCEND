<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCEND API — Swagger UI</title>
  <link rel="stylesheet" href="/webjars/swagger-ui/5.25.3/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/webjars/swagger-ui/5.25.3/swagger-ui-bundle.js"></script>

      url: "/openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout"
    });
  </script>
</body>
</html>
