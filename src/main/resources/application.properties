spring.application.name=ascend-api
server.port=${PORT:${SERVER_PORT:8082}}

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${ASCEND_DB_URL:jdbc:h2:file:/tmp/ascend-local;MODE=MySQL;AUTO_SERVER=FALSE;LOCK_TIMEOUT=10000}
spring.datasource.driver-class-name=${ASCEND_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${ASCEND_DB_USER:sa}
spring.datasource.password=${ASCEND_DB_PASSWORD:}

spring.jpa.database-platform=${ASCEND_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
