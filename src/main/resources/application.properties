spring.application.name=ascend-api
server.port=${PORT:${SERVER_PORT:8080}}

# Carrega variaveis locais (BACKEND-ASCEND-main/.env) sem versionar segredos.
# O arquivo e opcional: em producao use variaveis de ambiente do servico.
spring.config.import=optional:file:./.env[.properties]

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${ASCEND_DB_URL:jdbc:postgresql://${ASCEND_DB_HOST:localhost}:${ASCEND_DB_PORT:5432}/${ASCEND_DB_NAME:ascend}}
spring.datasource.driver-class-name=${ASCEND_DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${ASCEND_DB_USER:ascend}
spring.datasource.password=${ASCEND_DB_PASSWORD:ascend}

spring.jpa.database-platform=${ASCEND_DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# IA generativa (padrao: Groq, nivel gratuito sujeito a cota do provedor).
# A chave fica SOMENTE aqui no backend: nunca em VITE_* ou EXPO_PUBLIC_*.
ascend.ai.provider=${ASCEND_AI_PROVIDER:groq}
ascend.ai.base-url=${ASCEND_AI_BASE_URL:}
ascend.ai.api-key=${ASCEND_AI_API_KEY:${ASCEND_AI_KEY:${GROQ_API_KEY:}}}
ascend.ai.model=${ASCEND_AI_MODEL:openai/gpt-oss-20b}
ascend.ai.response-mode=${ASCEND_AI_RESPONSE_MODE:chat-completions}
ascend.ai.api-version=${ASCEND_AI_API_VERSION:}
ascend.ai.deployment=${ASCEND_AI_DEPLOYMENT:}
