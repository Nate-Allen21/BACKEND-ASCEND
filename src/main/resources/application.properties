spring.application.name=ascend-api
server.port=${PORT:${SERVER_PORT:8080}}

# Carrega variaveis locais (BACKEND-ASCEND-main/.env) sem versionar segredos.
# O arquivo e opcional: em producao use variaveis de ambiente do servico.
spring.config.import=optional:file:./.env[.properties]

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${ASCEND_DB_URL:jdbc:postgresql://${ASCEND_DB_HOST:localhost}:${ASCEND_DB_PORT:5432}/${ASCEND_DB_NAME:ascend}}
spring.datasource.driver-class-name=${ASCEND_DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${ASCEND_DB_USER:ascend}
spring.datasource.password=${ASCEND_DB_PASSWORD:ascend}

# Mantem o backend dentro do limite dos poolers gratuitos (como o Supabase).
# Durante um deploy o Render pode manter a instancia antiga e a nova ativas ao
# mesmo tempo, portanto o pool padrao do Hikari (10 conexoes) excede facilmente
# o limite de 15 conexoes observado em producao.
spring.datasource.hikari.maximum-pool-size=${ASCEND_DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${ASCEND_DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${ASCEND_DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${ASCEND_DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${ASCEND_DB_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${ASCEND_DB_MAX_LIFETIME_MS:600000}
spring.datasource.hikari.initialization-fail-timeout=${ASCEND_DB_INIT_FAIL_TIMEOUT_MS:60000}

spring.jpa.database-platform=${ASCEND_DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# IA generativa (padrao: Groq, nivel gratuito sujeito a cota do provedor).
# A chave fica SOMENTE aqui no backend: nunca em VITE_* ou EXPO_PUBLIC_*.
ascend.ai.provider=${ASCEND_AI_PROVIDER:groq}
ascend.ai.base-url=${ASCEND_AI_BASE_URL:}
ascend.ai.api-key=${ASCEND_AI_API_KEY:${ASCEND_AI_KEY:${GROQ_API_KEY:}}}
ascend.ai.model=${ASCEND_AI_MODEL:openai/gpt-oss-20b}
ascend.ai.response-mode=${ASCEND_AI_RESPONSE_MODE:chat-completions}
ascend.ai.api-version=${ASCEND_AI_API_VERSION:}
ascend.ai.deployment=${ASCEND_AI_DEPLOYMENT:}
