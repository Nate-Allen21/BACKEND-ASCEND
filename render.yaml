services:
  - type: web
    name: ascend-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASCEND_DB_URL
        sync: false
      - key: ASCEND_DB_USER
        sync: false
      - key: ASCEND_DB_PASSWORD
        sync: false
      - key: ASCEND_CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ASCEND_AI_MODEL
        value: gpt-4.1-mini
