services:
  - type: web
    name: ascend-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: ASCEND_DB_URL
        sync: false
      - key: ASCEND_DB_USER
        sync: false
      - key: ASCEND_DB_PASSWORD
        sync: false
      - key: ASCEND_CORS_ALLOWED_ORIGINS
        sync: false
      - key: ASCEND_AI_PROVIDER
        value: groq
      - key: ASCEND_AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ASCEND_AI_API_KEY
        sync: false
      - key: ASCEND_AI_MODEL
        value: openai/gpt-oss-20b
      - key: ASCEND_AI_RESPONSE_MODE
        value: chat-completions
