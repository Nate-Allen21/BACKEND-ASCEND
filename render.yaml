services:
  - type: web
    name: ascend-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASCEND_DB_URL
        sync: false
      - key: ASCEND_DB_USER
        sync: false
      - key: ASCEND_DB_PASSWORD
        sync: false
      - key: ASCEND_CORS_ALLOWED_ORIGINS
        sync: false
      - key: ASCEND_AI_PROVIDER
        value: llama
      - key: ASCEND_AI_BASE_URL
        value: https://api.llama.com/compat/v1
      - key: ASCEND_AI_KEY
        sync: false
      - key: ASCEND_AI_API_KEY
        sync: false
      - key: LLAMA_API_KEY
        sync: false
      - key: ASCEND_AI_MODEL
        value: Llama-3.3-8B-Instruct
      - key: ASCEND_AI_RESPONSE_MODE
        value: chat-completions
